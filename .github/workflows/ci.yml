name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests du moteur (docs/engine.js)
        run: node --test tests/
      - name: Syntaxe de tous les JS de l'app (node --check)
        run: |
          for f in docs/*.js docs/audio/index.js; do
            node --check "$f" || exit 1
          done
