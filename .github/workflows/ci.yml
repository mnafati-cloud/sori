name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendance du fit FSRS (test v1/v2)
        run: python -m pip install numpy==2.3.5
      - name: Tests du moteur (docs/engine.js)
        run: node --test tests/*.mjs   # forme explicite : node --test tests/ casse sous Node 22
      - name: Vérifier les illustrations publiées, leurs validations et le manifeste
        run: |
          npm ci --prefix tools/images --ignore-scripts
          node tools/images/pipeline.mjs check
          python -m py_compile tools/images/generate.py
          python -m unittest discover -s tools/images -p 'test_*.py'
      - name: Syntaxe de tous les JS de l'app (node --check)
        run: |
          for f in docs/*.js docs/audio/index.js; do
            node --check "$f" || exit 1
          done

  browser:
    name: PWA Chromium (sauvegarde et restauration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright et Chromium dans le runner isolé
        run: |
          npm install --prefix "$RUNNER_TEMP/sori-browser" playwright@1.63.0
          node "$RUNNER_TEMP/sori-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Tester la PWA avec des données synthétiques et une API cloud simulée
        run: NODE_PATH="$RUNNER_TEMP/sori-browser/node_modules" node tools/backup_smoke.cjs
      - name: Production de phrases, IME, reprise et mode avion
        run: NODE_PATH="$RUNNER_TEMP/sori-browser/node_modules" node tools/production_smoke.cjs
      - name: Signalements, distinctions lexicales et récupération des animations
        run: NODE_PATH="$RUNNER_TEMP/sori-browser/node_modules" node tools/ui_repairs_smoke.cjs
      - name: Images, absence de fichier, notation, IME et cache hors connexion
        run: NODE_PATH="$RUNNER_TEMP/sori-browser/node_modules" node tools/images_smoke.cjs
      - name: Captures et preuve de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sori-backup-browser
          path: browser-results/
          if-no-files-found: ignore
