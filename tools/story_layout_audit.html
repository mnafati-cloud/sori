<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>audit de mise en page — l’écran Histoire</title>
<link rel="stylesheet" href="../docs/style.css">
<link rel="stylesheet" href="../docs/themes.css">
<style>
  html,body{margin:0;padding:0}
  /* la fenêtre Chrome n'est pas le viewport (zoom système, largeur mini) : on fige ici */
  body{width:375px;height:812px;min-height:0;overflow:hidden}
  #topbar,#tabs{flex:none}
  #topbar{height:50px}
  #tabs{height:52px}
  /* en headless l'animation d'entrée du thème reste figée sur sa 1re keyframe (scale 1.55) et
     fausse tous les rectangles : on la neutralise, elle n'a rien à voir avec la mise en page */
  #screen > *{animation:none !important}
</style>
</head>
<body class="theme-takbon">
<div id="topbar"><div class="brand">소리 <span>Sori</span></div></div>
<div id="screen"></div>
<div id="tabs"><button class="active"><span>histoire</span></button></div>
<script src="../docs/story-data.js"></script>
<script src="../docs/story-sens.js"></script>
<script src="../docs/story.js"></script>
<script>
function ouvre(nch){
  var data = window.STORY_DATA, corpus = data.chapitres;
  var ch = corpus.filter(function(c){ return c.n === nch; })[0];
  var sc = document.getElementById("screen");
  SORI_STORY.renderChapter(sc, {
    corpus: corpus, profile: {}, labelOf: function(){ return ""; },
    sens: window.STORY_SENS || {}, lus: [], ouverts: corpus.map(function(c){ return c.n; }),
    speak: function(){}, saison: { kr: data.titre_kr, fr: data.titre_fr }
  }, ch);
  return sc;
}
function MAQ(nch, unite, mode){
  var sc = ouvre(nch), suiv = sc.querySelector(".suiv");
  for(var i = 0; i <= unite; i++) suiv.click();
  if(mode === "phrase") sc.querySelector(".st-oeil").click();
  if(mode && mode.indexOf("mot") === 0){
    var k = parseInt(mode.slice(3), 10) || 0;
    var ws = sc.querySelectorAll(".st-kr .st-w");
    ws[Math.min(k, ws.length - 1)].click();
  }
}

/* ---- audit : aucune boîte ne doit en recouvrir une autre, rien ne doit être tronqué ----
   Modèle v128 : une seule boîte de révélation (.st-reveal) montre soit un mot, soit toute la
   phrase (l'œil). On vérifie les deux chemins : la révélation ne doit ni recouvrir les gestes/le
   pied, ni être tronquée, à chaque unité et pour chaque mot. */
function rect(sc, sel){ var e = sc.querySelector(sel); return e && e.getClientRects().length ? e.getBoundingClientRect() : null; }
function chevauche(a, b){ return a && b && a.top < b.bottom - 1 && b.top < a.bottom - 1; }
function verifs(sc, id, pbs){
  var rev = rect(sc, ".st-reveal"), gestes = rect(sc, ".st-gestes"), pied = rect(sc, ".st-pied");
  var revEl = sc.querySelector(".st-reveal");
  if(rev && chevauche(rev, gestes)) pbs.push(id + " : la révélation recouvre les gestes"
    + " [rev " + Math.round(rev.top) + "-" + Math.round(rev.bottom)
    + " gestes " + Math.round(gestes.top) + "-" + Math.round(gestes.bottom) + "]");
  if(rev && chevauche(rev, pied)) pbs.push(id + " : la révélation recouvre le pied");
  if(revEl && !revEl.hidden && revEl.scrollHeight > revEl.clientHeight + 2)
    pbs.push(id + " : révélation tronquée (" + revEl.scrollHeight + ">" + revEl.clientHeight + ")");
}
function AUDIT(){
  var data = window.STORY_DATA, pbs = [], nUnites = 0, nDefile = 0;
  data.chapitres.forEach(function(ch){
    var sc = ouvre(ch.n), suiv = sc.querySelector(".suiv");
    suiv.click();                                   /* affiche -> unité 0 */
    ch.sentences.forEach(function(s, i){
      var ws = sc.querySelectorAll(".st-kr .st-w");
      var oeil = sc.querySelector(".st-oeil");
      var id = "ch" + ch.n + " u" + (i + 1);
      nUnites++;
      /* le hangul ne doit jamais se couper dans sa moitié haute */
      var krEl = sc.querySelector(".st-kr");
      if(krEl && krEl.scrollHeight > krEl.clientHeight + 2) pbs.push(id + " : texte coréen tronqué");
      /* chemin œil : toute la phrase */
      oeil.click();
      var revEl = sc.querySelector(".st-reveal");
      if(revEl && !revEl.hidden && revEl.scrollHeight > revEl.clientHeight + 2) nDefile++;
      verifs(sc, id + " oeil", pbs);
      oeil.click();                                 /* referme */
      /* chemin mot : chaque mot, un à la fois */
      for(var k = 0; k < ws.length; k++){
        ws[k].click();
        verifs(sc, id + " mot" + k, pbs);
        ws[k].click();                              /* referme */
      }
      suiv.click();
    });
  });
  return { pbs: pbs, info: "phrase qui defile : " + nDefile + "/" + nUnites + " unites" };
}
(function(){
  var q = new URLSearchParams(location.search);
  if(q.get("w")) document.body.style.width = q.get("w") + "px";
  if(q.get("h")) document.body.style.height = q.get("h") + "px";
  if(q.get("audit")){
    var r = AUDIT(), pbs = r.pbs;
    var norm = function(p){ return p.replace(/^ch\d+ u\d+ (oeil|mot\d+) : /, ""); };
    var uniq = {}; pbs.forEach(function(p){ uniq[norm(p)] = (uniq[norm(p)] || 0) + 1; });
    var res = "AUDIT " + document.body.offsetWidth + "x" + document.body.offsetHeight + " : "
      + pbs.length + " defauts — " + r.info + "\n"
      + Object.keys(uniq).map(function(k){ return "  " + uniq[k] + " x " + k; }).join("\n")
      + "\n" + pbs.slice(0, 6).join("\n");
    document.body.innerHTML = "<pre id=rapport>" + res.replace(/[<&]/g, "?") + "</pre>";
    return;
  }
  if(q.get("stale")){
    /* la révélation ne doit PAS persister d'une page à l'autre (retour user v127) */
    var sc = ouvre(1), suiv = sc.querySelector(".suiv"), out = [];
    suiv.click();                                     /* -> unité 1 */
    sc.querySelector(".st-kr .st-w").click();         /* touche un mot : révélation ouverte */
    var revOuv = !sc.querySelector(".st-reveal").hidden;
    suiv.click();                                     /* page suivante */
    var revFerme = sc.querySelector(".st-reveal").hidden;
    var motAllume = !!sc.querySelector(".st-w.on");
    sc.querySelector(".st-oeil").click();             /* œil : phrase */
    var phraseOuv = !sc.querySelector(".st-reveal").hidden;
    suiv.click();
    var phraseFerme = sc.querySelector(".st-reveal").hidden && !sc.querySelector(".st-oeil").classList.contains("on");
    out.push("mot ouvre la revelation : " + revOuv);
    out.push("changer de page la referme : " + revFerme);
    out.push("aucun mot reste allume : " + !motAllume);
    out.push("oeil ouvre la phrase : " + phraseOuv);
    out.push("changer de page ferme la phrase + eteint l'oeil : " + phraseFerme);
    out.push("VERDICT : " + (revOuv && revFerme && !motAllume && phraseOuv && phraseFerme ? "OK" : "ECHEC"));
    document.body.innerHTML = "<pre id=rapport>" + out.join("\n") + "</pre>";
    return;
  }
  if(!q.get("ch")) return;
  MAQ(parseInt(q.get("ch"), 10), parseInt(q.get("u") || "0", 10), q.get("mode") || "");
  if(q.get("probe")){
    var sc = document.getElementById("screen"), out = [];
    [["screen", sc], ["st-c", sc.querySelector(".st-c")], ["haut", sc.querySelector(".st-haut")],
     ["bas", sc.querySelector(".st-bas")], ["reveal", sc.querySelector(".st-reveal")],
     ["gestes", sc.querySelector(".st-gestes")], ["son", sc.querySelector(".st-son")],
     ["pied", sc.querySelector(".st-pied")]].forEach(function(p){
      var e = p[1]; if(!e){ out.push(p[0] + " : absent"); return; }
      var r = e.getBoundingClientRect(), cs = getComputedStyle(e);
      out.push(p[0] + " top=" + Math.round(r.top) + " h=" + Math.round(r.height)
        + " scrollH=" + e.scrollHeight + " client=" + e.clientHeight
        + " flex=" + cs.flex + " transform=" + cs.transform + " overflow=" + cs.overflowY);
    });
    out.push("classes st-c : " + sc.querySelector(".st-c").className);
    var pre = document.createElement("pre"); pre.id = "probe"; pre.textContent = out.join("\n");
    document.body.appendChild(pre);
  }
})();
</script>
</body>
</html>
